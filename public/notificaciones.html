<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HallazGo · Notificaciones</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="assets/css/styles.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/sidebar-layout.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script
    src="assets/js/supabase-config.js"
    defer
  ></script>
  <script src="assets/js/mfa-guard.js" defer></script>

  <script
    src="assets/js/responsive-sidebar.js"
    defer
  ></script>

  <script
    src="assets/js/notificaciones-supabase.js"
    defer
  ></script>

  <script
    src="assets/js/app.js"
    defer
  ></script>
</head>

<body
  data-page="notificaciones"
  class="cinematic-page cinematic-notifications"
>

  <header class="cinematic-header">

    <a
      class="cinematic-logo"
      href="index.html"
      aria-label="Ir al inicio de HallazGo"
    >
      <span>H</span>
      <strong>HallazGo</strong>
    </a>

    <nav
      class="cinematic-nav"
      aria-label="Navegación principal"
    >
      <a href="index.html">
        Inicio
      </a>

      <a href="reportar-objeto.html">
        Reportar objeto
      </a>

      <a href="buscar-objetos.html">
        Buscar objetos
      </a>

      <a href="mis-reportes.html">
        Mis reportes
      </a>

      <a href="como-funciona.html">
        Cómo funciona
      </a>
    </nav>

    <a
      class="cinematic-user"
      href="seleccionar-rol.html"
      aria-label="Mi cuenta"
      title="Mi cuenta"
    >
      <svg
        viewBox="0 0 48 48"
        aria-hidden="true"
      >
        <circle
          cx="24"
          cy="16"
          r="7"
        ></circle>

        <path
          d="
            M11 39
            C11 30.5 16.5 25 24 25
            C31.5 25 37 30.5 37 39
          "
        ></path>
      </svg>
    </a>

  </header>

  <main>

    <section
      class="hallazgo-notifications"
      data-notifications-page
    >

      <div class="hallazgo-notifications__container">

        <header class="hallazgo-notifications__header">

          <div>

            <p class="hallazgo-notifications__eyebrow">
              CENTRO DE ACTIVIDAD
            </p>

            <h1>
              Notificaciones
            </h1>

            <p>
              Revisa las reclamaciones recibidas y los cambios
              relacionados con tus objetos.
            </p>

          </div>

          <div class="hallazgo-notifications__summary">

            <strong data-notifications-unread>
              0
            </strong>

            <span>
              sin leer
            </span>

          </div>

        </header>

        <div class="hallazgo-notifications__toolbar">

          <button
            type="button"
            class="hallazgo-notifications__mark-all"
            data-notifications-mark-all
          >
            Marcar todas como leídas
          </button>

        </div>

        <div
          class="hallazgo-notifications__status"
          data-notifications-status
          aria-live="polite"
        >
          Cargando notificaciones...
        </div>

        <div
          class="hallazgo-notifications__list"
          data-notifications-list
          hidden
        ></div>

      </div>

    </section>

  </main>

</body>

</html>
